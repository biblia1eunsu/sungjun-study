<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>성준이 공부방</title>
<meta name="description" content="성준이의 겨울방학 2주 공부방 - 수학, 영어, 한국사, 위인, 과학을 하루씩.">
<meta name="theme-color" content="#0e2140">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="성준이 공부방">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div class="top-row">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="34" height="34" fill="none">
          <rect x="1" y="1" width="38" height="38" rx="11" fill="#0e2140"/>
          <rect x="1" y="1" width="38" height="38" rx="11" fill="url(#g)"/>
          <path d="M20 12.5c-2.6-1.7-5.6-2-8-2v15c2.4 0 5.4.3 8 2 2.6-1.7 5.6-2 8-2v-15c-2.4 0-5.4.3-8 2Z" fill="#fff"/>
          <path d="M20 12.5v17" stroke="#0d7a69" stroke-width="1.6"/>
          <path d="M20 7.6l1.5 2.7 3 .4-2.2 2.1.5 3-2.8-1.5-2.8 1.5.5-3-2.2-2.1 3-.4L20 7.6Z" fill="#ffd666"/>
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="38" y2="38" gradientUnits="userSpaceOnUse">
              <stop stop-color="#0e2140"/><stop offset="1" stop-color="#0d7a69"/>
            </linearGradient>
          </defs>
        </svg>
      </span>
      <div class="brand-text">
        <h1>성준이 공부방</h1>
        <p id="todayText">—</p>
      </div>
    </div>
    <button id="themeBtn" class="icon-btn" aria-label="화면 밝기 바꾸기" title="화면 밝기 바꾸기">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"/>
      </svg>
    </button>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-head">
        <span class="stat-label">오늘의 공부</span>
        <strong id="progText">0 / 5</strong>
      </div>
      <div class="bar" role="progressbar" aria-label="오늘의 공부 진행률" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0">
        <i id="progBar"></i>
      </div>
    </div>
    <div class="stat stat-streak">
      <span class="stat-label">연속 학습</span>
      <strong id="streakText">0일</strong>
    </div>
  </div>

  <div class="dayswitch">
    <button id="prevDay" class="day-btn" aria-label="이전 일차">이전</button>
    <div class="day-current">
      <span id="dayNum">1일차</span>
      <span id="dayTheme" class="day-theme">—</span>
    </div>
    <button id="nextDay" class="day-btn" aria-label="다음 일차">다음</button>
  </div>
</header>

<nav id="tabs" class="tabs" aria-label="과목 선택"></nav>

<main id="view" class="view"></main>

<div class="actionbar">
  <button id="notifyBtn" class="notify-btn">오늘 공부 완료! 엄마에게 알리기</button>
  <p id="notifyHint" class="notify-hint">두 주 동안 하루도 빠지지 않고 이어가 보자.</p>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="data/day01.js"></script>
<script src="data/day02.js"></script>
<script src="data/day03.js"></script>
<script src="data/day04.js"></script>
<script src="data/day05.js"></script>
<script src="data/day06.js"></script>
<script src="data/day07.js"></script>
<script src="data/day08.js"></script>
<script src="data/day09.js"></script>
<script src="data/day10.js"></script>
<script src="data/day11.js"></script>
<script src="data/day12.js"></script>
<script src="data/day13.js"></script>
<script src="data/day14.js"></script>
<script src="app.js"></script>
</body>
</html>
